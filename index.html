<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TeachMe</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
</head>
<body>
<header class="topbar">
  <div class="brand" data-page="home">Teach<span>Me</span></div>
  <nav class="nav" id="nav">
    <button data-page="home" class="navbtn">Home</button>
    <button data-page="courses" class="navbtn">Courses</button>
    <button data-page="dashboard" class="navbtn authOnly" hidden>My Learning</button>
    <button data-page="teacher" class="navbtn teacherOnly" hidden>Teacher Studio</button>
  </nav>
  <div class="navRight">
    <button data-page="account" class="navbtn authOnly" id="accountNavBtn" hidden>
      <span class="miniAvatar" id="miniAvatar"></span>
      <span id="navName">Account</span>
    </button>
    <button data-page="auth" class="btn ghost small guestOnly" id="loginNavBtn">Login</button>
    <button class="btn ghost small authOnly" id="logoutBtn" hidden>Log out</button>
  </div>
</header>

<main id="app"></main>

<div id="toast" class="toast" hidden></div>
<canvas id="certCanvas" width="1200" height="850" hidden></canvas>
</body>
</html>
