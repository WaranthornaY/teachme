<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TeachMe</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header>
  <div class="brand">TeachMe</div>
  <nav>
    <button data-page="home">Home</button>
    <button data-page="courses">Courses</button>
    <button data-page="dashboard">Dashboard</button>
    <button id="teacherNav" data-page="teacher" hidden>Teacher</button>
    <button id="authNav" data-page="auth">Login</button>
    <button id="logoutBtn" hidden>Logout</button>
  </nav>
</header>
<main>
<section id="home" class="page active"><div class="hero"><h1>Learn. Practice. Achieve.</h1><p>Online classroom learning with your progress saved securely.</p><button class="primary" data-page="courses">Browse courses</button></div></section>
<section id="courses" class="page"><h2>Courses</h2><input id="courseSearch" placeholder="Search courses..."><div id="courseList" class="grid"></div></section>
<section id="dashboard" class="page"><h2>My Dashboard</h2><div id="dashboardContent"></div></section>
<section id="teacher" class="page"><h2>Teacher Dashboard</h2><div id="teacherContent"></div></section>
<section id="auth" class="page"><div class="authbox"><h2 id="authTitle">Login</h2><div id="authMessage"></div><input id="username" autocomplete="username" placeholder="Username"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="authSubmit" class="primary">Login</button><p><button id="toggleAuth" class="link">Create a student account</button></p></div></section>
<section id="courseView" class="page"><button class="link" data-page="courses">← Back to courses</button><div id="courseDetails"></div></section>
</main>
<div id="toast"></div>
<script src="script.js"></script>
</body>
</html>
